############################################################
# Geyser Manager (Package)
# - Alarm interlock (armed_away => OFF)
# - Night OFF window (default 20:00 -> 05:00)
# - Morning preheat window (default 05:00 -> 06:30)
# - Temperature control with offset + hysteresis
############################################################

input_boolean:
  geyser_manager_enabled:
    name: "Geyser manager enabled"
    icon: mdi:water-boiler

  geyser_allow_preheat_during_night_off:
    name: "Allow preheat during night off window"
    icon: mdi:timer-check

input_number:
  geyser_target_tank_temp:
    name: "Geyser target tank temperature (estimated)"
    min: 45
    max: 70
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer

  geyser_temp_hysteresis:
    name: "Geyser hysteresis"
    min: 1
    max: 10
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:chart-bell-curve-cumulative

  geyser_pipe_to_tank_offset:
    name: "Pipe → tank offset"
    min: -5
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:swap-vertical

input_datetime:
  geyser_night_off_time:
    name: "Geyser night OFF time"
    has_date: false
    has_time: true

  geyser_preheat_start:
    name: "Geyser preheat start"
    has_date: false
    has_time: true

  geyser_ready_by:
    name: "Geyser ready by"
    has_date: false
    has_time: true

  geyser_last_on:
    name: "Geyser last ON"
    has_date: true
    has_time: true

template:
  - sensor:
      - name: "Geyser estimated tank temperature"
        unique_id: geyser_estimated_tank_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set t = states('sensor.thr316_temperature') %}
          {% set o = states('input_number.geyser_pipe_to_tank_offset') %}
          {% if t in ['unknown','unavailable','none',''] or o in ['unknown','unavailable','none',''] %}
            {{ 'unknown' }}
          {% else %}
            {{ (t|float + o|float) | round(1) }}
          {% endif %}

  - binary_sensor:
      - name: "Geyser night off active"
        unique_id: geyser_night_off_active
        state: >
          {% set night = states('input_datetime.geyser_night_off_time') %}
          {% set preheat = states('input_datetime.geyser_preheat_start') %}
          {% if night in ['unknown','unavailable','none',''] or preheat in ['unknown','unavailable','none',''] %}
            false
          {% else %}
            {% set start = today_at(night) %}
            {% set end = today_at(preheat) %}
            {# Handle crossing midnight: end may be tomorrow #}
            {% if end <= start %}
              {% set end = end + timedelta(days=1) %}
            {% endif %}
            {% set nowt = now() %}
            {{ nowt >= start and nowt < end }}
          {% endif %}

      - name: "Geyser preheat window active"
        unique_id: geyser_preheat_window_active
        state: >
          {% set preheat = states('input_datetime.geyser_preheat_start') %}
          {% set ready = states('input_datetime.geyser_ready_by') %}
          {% if preheat in ['unknown','unavailable','none',''] or ready in ['unknown','unavailable','none',''] %}
            false
          {% else %}
            {% set start = today_at(preheat) %}
            {% set end = today_at(ready) %}
            {% if end <= start %}
              {% set end = end + timedelta(days=1) %}
            {% endif %}
            {% set nowt = now() %}
            {{ nowt >= start and nowt < end }}
          {% endif %}

automation:
  ############################################################
  # Stamp "last on" whenever geyser is turned on
  ############################################################
  - id: geyser_manager_stamp_last_on
    alias: "Geyser manager – Stamp last ON"
    mode: single
    trigger:
      - platform: state
        entity_id: switch.geyser_contactor
        to: "on"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.geyser_last_on
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  ############################################################
  # Main control loop (priority-based)
  ############################################################
  - id: geyser_manager_control
    alias: "Geyser manager – Control"
    mode: restart
    trigger:
      # periodic check to keep it responsive even if some entities don't fire
      - platform: time_pattern
        minutes: "/1"

      # react immediately to key state changes
      - platform: state
        entity_id:
          - input_boolean.geyser_manager_enabled
          - input_boolean.geyser_allow_preheat_during_night_off
          - input_number.geyser_target_tank_temp
          - input_number.geyser_temp_hysteresis
          - input_number.geyser_pipe_to_tank_offset
          - input_datetime.geyser_night_off_time
          - input_datetime.geyser_preheat_start
          - input_datetime.geyser_ready_by
          - sensor.thr316_temperature
          - alarm_control_panel.partition_huis_alarm

    variables:
      enabled: "{{ is_state('input_boolean.geyser_manager_enabled', 'on') }}"
      alarm_state: "{{ states('alarm_control_panel.partition_huis_alarm') }}"
      estimated: "{{ states('sensor.geyser_estimated_tank_temperature') }}"
      target: "{{ states('input_number.geyser_target_tank_temp') | float(58) }}"
      hyst: "{{ states('input_number.geyser_temp_hysteresis') | float(3) }}"
      night_off_active: "{{ is_state('binary_sensor.geyser_night_off_active', 'on') }}"
      preheat_active: "{{ is_state('binary_sensor.geyser_preheat_window_active', 'on') }}"
      allow_preheat_in_night_off: "{{ is_state('input_boolean.geyser_allow_preheat_during_night_off', 'on') }}"
      geyser_is_on: "{{ is_state('switch.geyser_contactor', 'on') }}"

    action:
      ########################################################
      # 0) If manager disabled => OFF (fail safe)
      ########################################################
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not enabled }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.geyser_contactor
              - stop: "Manager disabled"

      ########################################################
      # 1) Alarm interlock (highest priority)
      ########################################################
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ alarm_state == 'armed_away' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.geyser_contactor
              - stop: "Alarm armed_away interlock"

      ########################################################
      # 2) Night OFF window (unless explicitly allowed)
      ########################################################
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ night_off_active and not allow_preheat_in_night_off }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.geyser_contactor
              - stop: "Night OFF window active"

      ########################################################
      # Guard: If temperature unknown/unavailable, do nothing
      ########################################################
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ estimated in ['unknown','unavailable','none',''] }}"
            sequence:
              - stop: "Estimated temperature not available"

      ########################################################
      # 3) Preheat window behaviour
      #    Goal: be at/above target by 'ready_by', but still
      #    obey cutoff (avoid overheating).
      ########################################################
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ preheat_active }}"
            sequence:
              - choose:
                  # If already at/above target -> OFF
                  - conditions:
                      - condition: template
                        value_template: "{{ (estimated|float) >= target }}"
                    sequence:
                      - service: switch.turn_off
                        target:
                          entity_id: switch.geyser_contactor

                  # If below target -> ON
                  - conditions:
                      - condition: template
                        value_template: "{{ (estimated|float) < target }}"
                    sequence:
                      - service: switch.turn_on
                        target:
                          entity_id: switch.geyser_contactor
              - stop: "Handled preheat window"

      ########################################################
      # 4) Normal temperature maintenance (outside preheat)
      #    - ON if <= (target - hysteresis)
      #    - OFF if >= target
      #    - otherwise keep current state (anti-chatter)
      ########################################################
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (estimated|float) >= target }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.geyser_contactor

          - conditions:
              - condition: template
                value_template: "{{ (estimated|float) <= (target - hyst) }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.geyser_contactor

        default: []
